<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>かたちのマッチング</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
    background: #ffffff;
    color: #222;
    touch-action: manipulation;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }

  .app {
    width: min(1100px, 100%);
    padding: 18px 22px 28px;
  }

  h1 {
    margin: 0;
    text-align: center;
    font-size: clamp(28px, 4vw, 44px);
    font-weight: 700;
    letter-spacing: .08em;
  }

  .instruction {
    text-align: center;
    font-size: clamp(20px, 2.8vw, 30px);
    font-weight: 700;
    margin: 8px 0 18px;
  }

  .board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }

  .target-card {
    position: relative;
    height: clamp(180px, 25vw, 250px);
    border: 4px solid #c89b62;
    border-radius: 2px;
    background: #fff;
    overflow: hidden;
  
    box-sizing: border-box;
    contain: layout;
  }

  .model-area {
    position: absolute;
    left: 0;
    top: 0;
    width: 39%;
    height: 63%;
    border-right: 3px solid #c89b62;
    border-bottom: 3px solid #c89b62;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
  }

  .model-shape {
    width: clamp(70px, 10vw, 100px);
    height: clamp(70px, 10vw, 100px);
    flex: 0 0 auto;
  }

  .drop-area {
    position: absolute;
    left: 39%;
    top: 0;
    right: 0;
    bottom: 0;
    width: 61%;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .drop-area.highlight {
    background: #fff8df;
  }

  .drop-area.correct {
    background: #f1faee;
  }

  .placed-shape {
    width: 78px;
      height: 78px;
      min-width: 78px;
      min-height: 78px;
      max-width: 78px;
      max-height: 78px;
      flex: 0 0 78px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }

  .choices {
    margin-top: 24px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border: 3px solid #222;
  }

  .choice {
    min-height: clamp(140px, 18vw, 190px);
    border-right: 3px solid #222;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
    transition: transform .12s ease, background .12s ease;
  }

  .choice:last-child { border-right: 0; }

  .choice:active {
    cursor: grabbing;
    background: #f7f7f7;
  }

  .choice.used {
    opacity: .22;
    cursor: default;
  }

  .drag-ghost {
    position: fixed;
    left: 0;
    top: 0;
    width: clamp(70px, 10vw, 100px);
    height: clamp(70px, 10vw, 100px);
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
  }

  .drag-ghost .shape {
    width: 100%;
    height: 100%;
  }

  .shape {
    width: clamp(70px, 10vw, 100px);
    height: clamp(70px, 10vw, 100px);
    display: block;
  }

  .progress {
    position: fixed;
    top: 14px;
    right: 18px;
    z-index: 1000;
    font-size: clamp(20px, 3vw, 32px);
    font-weight: 700;
    letter-spacing: .08em;
    background: rgba(255,255,255,.92);
    padding: 4px 8px;
    border-radius: 8px;
  }

  .message {
    min-height: 42px;
    margin-top: 14px;
    text-align: center;
    font-size: clamp(18px, 2.5vw, 27px);
    font-weight: 700;
  }

  body.finished::before {
    content: "よくできました";
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #222;
    font-size: clamp(48px, 10vw, 110px);
    font-weight: 700;
  }

  body.finished .app {
    visibility: hidden;
  }

  .reset {
    display: block;
    margin: 4px auto 0;
    min-width: 180px;
    min-height: 54px;
    padding: 8px 20px;
    border: 0;
    border-radius: 12px;
    background: #555;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }

  @media (max-width: 700px) {
    .app { padding: 12px 12px 20px; }
    .board { gap: 10px; }
    .target-card { height: 180px; border-width: 3px; }
    .model-area { border-width: 2px; }
    .choices { margin-top: 14px; border-width: 2px; }
    .choice { min-height: 125px; border-width: 2px; }
    .reset { min-height: 50px; }
  }

  @media (orientation: portrait) and (max-width: 600px) {
    .target-card { height: 165px; }
    .choice { min-height: 105px; }
  }

  /* iPadの画面内に課題全体を収める */
  html, body {
    height: 100%;
    overflow: hidden;
  }

  .app {
    height: 100vh;
    min-height: 0;
    box-sizing: border-box;
  }

  .board {
    min-height: 0;
  }

  .choices {
    min-height: 0;
  }

  @media (max-width: 900px) {
    .app {
      padding-top: 12px;
      padding-bottom: 12px;
    }

    .board {
      gap: 8px;
    }

    .choices {
      gap: 10px;
    }
  }


  /* 「もういちど」は11セット終了後だけ表示 */
  #reset {
    display: none !important;
  }

  body.finished #reset {
    display: block !important;
    visibility: visible;
    position: fixed;
    z-index: 2001;
    left: 50%;
    top: calc(50% + clamp(70px, 10vw, 110px));
    transform: translateX(-50%);
    margin: 0;
  }


  /* iPad縦画面：上の見本から下の選択肢まで画面内に収める */
  @media (max-width: 1366px) and (orientation: landscape) {
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100dvh;
      min-height: 0;
      max-height: 100dvh;
      box-sizing: border-box;
      padding: 6px 12px 8px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto auto;
      gap: 6px;
      overflow: hidden;
    }

    h1 {
      font-size: clamp(24px, 4vw, 36px);
      line-height: 1.1;
    }

    .board {
      width: 100%;
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      overflow: hidden;
    }

    .target-card {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-height: 100%;
      box-sizing: border-box;
      overflow: hidden;
      position: relative;
    }

    .model-area,
    .drop-area {
      min-width: 0;
      min-height: 0;
      width: auto;
      height: auto;
    }

    /* ドロップ後の中身が枠のサイズ計算に影響しないよう固定 */
    .drop-area {
      overflow: hidden;
      contain: layout paint size;
    }

    .placed-shape {
      width: 78px;
      height: 78px;
      min-width: 78px;
      min-height: 78px;
      max-width: 78px;
      max-height: 78px;
      flex: 0 0 78px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .placed-shape .shape {
      width: 78px;
      height: 78px;
      max-width: 78px;
      max-height: 78px;
      flex: 0 0 78px;
    }

    /* 選択肢は潰さず、画面内に必ず残す */
    .choices {
      width: 100%;
      height: 96px;
      min-height: 96px;
      margin-top: 0;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 0;
    }

    .choice {
      width: 100%;
      height: 100%;
      min-height: 0;
      box-sizing: border-box;
    }

    .choice .shape {
      width: 78px;
      height: 78px;
      max-width: 90%;
      max-height: 90%;
    }

    .message {
      min-height: 0;
      height: 0;
      margin: 0;
      overflow: visible;
    }

    .progress {
      top: 4px;
      right: 8px;
    }
  }


  /* iPad横画面：上の見本から下の選択肢まで画面内に収める */
  @media (max-width: 1366px) and (orientation: landscape) {
    html, body {
      height: 100%;
      min-height: 100%;
      overflow: hidden;
    }

    .app {
      height: 100dvh;
      min-height: 0;
      max-height: 100dvh;
      box-sizing: border-box;
      padding: 8px 14px 8px;
      gap: 8px;
      overflow: hidden;
    }

    .board {
      flex: 1 1 auto;
      min-height: 0;
      height: auto;
      gap: 8px;
    }

    .target-card {
      min-height: 0;
      height: auto;
    }

    .model-area,
    .drop-area {
      min-height: 0;
    }

    /* 選択肢を潰さない */
    .choices {
      flex: 0 0 auto;
      min-height: 0;
      height: auto;
      gap: 10px;
      padding: 4px 0 6px;
    }

    .choice {
      min-height: 72px;
      height: 72px;
    }

    .choice .shape {
      max-width: 100%;
      max-height: 100%;
    }

    .progress {
      top: 6px;
      right: 10px;
    }
  }


  /* iPad横画面：ドロップ前後で上の枠の大きさを完全固定 */
  @media (max-width: 1366px) and (orientation: landscape) {
    .board {
      display: grid !important;
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      grid-template-rows: repeat(2, minmax(0, 1fr)) !important;
      min-height: 0 !important;
      height: 100% !important;
    }

    .target-card {
      width: 100% !important;
      height: 100% !important;
      min-width: 0 !important;
      min-height: 0 !important;
      max-width: 100% !important;
      max-height: 100% !important;
      box-sizing: border-box !important;
      overflow: hidden !important;
      contain: strict !important;
    }

    .drop-area {
      position: absolute !important;
      left: 39% !important;
      top: 0 !important;
      width: 61% !important;
      height: 100% !important;
      right: auto !important;
      bottom: auto !important;
      min-width: 0 !important;
      min-height: 0 !important;
      max-width: 61% !important;
      max-height: 100% !important;
      box-sizing: border-box !important;
      overflow: hidden !important;
      contain: strict !important;
    }

    .placed-shape {
      width: 78px !important;
      height: 78px !important;
      min-width: 78px !important;
      min-height: 78px !important;
      max-width: 78px !important;
      max-height: 78px !important;
      flex: 0 0 78px !important;
      box-sizing: border-box !important;
    }
  }


  /* 4〜7セット目：iPadでも見本と選択肢を同じ大きさで表示 */
  .size-matched,
  .choice-size-matched {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    box-sizing: border-box;
  }

  .size-matched .shape,
  .choice-size-matched .shape {
    width: 100% !important;
    height: 100% !important;
    max-width: 100% !important;
    max-height: 100% !important;
    flex: 0 0 auto !important;
  }


  /* 横向き学習画面：見本と選択肢を表示領域内に配分する */
  @media (orientation: landscape) {
    .app {
      width: min(1100px, 100%);
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      max-height: 100dvh;
      padding: max(8px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) clamp(104px, 18dvh, 140px) 24px;
      gap: 8px;
      overflow: hidden;
    }
    h1 { font-size: clamp(24px, 4vw, 36px); line-height: 1.1; }
    .board {
      height: auto !important;
      min-height: 0 !important;
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      grid-template-rows: repeat(2, minmax(0, 1fr)) !important;
      gap: 8px;
    }
    .target-card {
      height: 100% !important;
      min-height: 0 !important;
      min-width: 0;
      contain: strict;
    }
    .model-area { width: 39%; height: 63%; }
    .choices {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      padding: 0;
      gap: 0;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .choice { height: 100%; min-height: 0; min-width: 0; }
    .choice .shape { width: 100px; height: 100px; max-width: 100%; max-height: 100%; }
    .message { height: 24px; min-height: 0; margin: 0; font-size: 20px; line-height: 24px; }
  }


/* 課題10・11：生活用品の形の分類 */
.app.everyday-mode {
  display: grid;
  height: 100vh;
  height: 100dvh;
  grid-template-rows: auto minmax(0, 1fr) clamp(180px, 36dvh, 270px) 24px;
  gap: 10px;
  padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
}
.everyday-mode h1 { font-size: clamp(24px, 3vw, 36px); line-height: 1.15; }
.everyday-mode .progress { font-size: clamp(17px, 2.3vw, 26px); }
.everyday-mode .board {
  height: auto !important;
  grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
  grid-template-rows: minmax(0, 1fr) !important;
  gap: 10px;
}
.category-card { display: flex; flex-direction: column; min-height: 0; }
.category-card h2 {
  flex: 0 0 auto; margin: 0; padding: 8px 2px; text-align: center;
  font-size: clamp(24px, 3vw, 34px); line-height: 1.15;
  border-bottom: 2px solid #c89b62;
}
.category-card .category-drop {
  position: relative !important; inset: auto !important;
  width: 100% !important; height: auto !important;
  max-width: 100% !important; max-height: none !important;
  flex: 1 1 0; min-height: 0 !important;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 4px;
  contain: layout paint !important;
}
.sorted-object { width: 100%; height: 100%; min-width: 0; min-height: 0; display: flex; justify-content: center; align-items: center; }
.sorted-object .object-art { width: 100%; height: 100%; max-width: 110px; max-height: 110px; }
.everyday-mode .choices {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
  gap: 8px; height: 100%; min-height: 0; padding: 0; margin: 0; border: 0;
}
.everyday-mode .object-choice {
  border: 2px solid #666; border-radius: 8px;
  width: 100%; height: 100%; min-height: 0; min-width: 0; padding: 3px;
}
.everyday-mode .object-choice .object-art { width: 100%; height: 100%; max-width: 120px; max-height: 120px; }
.object-choice.sorted { visibility: hidden; pointer-events: none; }
.everyday-mode .message { height: 24px; min-height: 0; margin: 0; font-size: 20px; line-height: 24px; }
.drop-area.highlight { box-shadow: inset 0 0 0 4px #edc45a; }

</style>
</head>
<body>
<div class="app">
  <div class="progress" id="progress">○○○○○</div>
  <div class="drag-ghost" id="dragGhost"></div>
  <h1>◆ マッチング</h1>
  

  <main class="board" id="board"></main>

  <div class="choices" id="choices"></div>

  <div class="message" id="message" aria-live="polite"></div>
  <button class="reset" id="reset">もういちど</button>
</div>

<script>
"use strict";

/*
  9セットの形マッチング課題
  1〜3：丸・三角・四角・星。形と色が同じものが正解
  4：丸だけ。色は同じで、大きさが異なる
  5：三角だけ。色は同じで、大きさが異なる
  6：四角だけ。色は同じで、大きさが異なる
  7：星だけ。色は同じで、大きさが異なる
  8〜9：形は異なるが、色が同じものが正解
*/

const colorPalette = ["#e96b63", "#62a6d8", "#e8a84b", "#8f73b8"];
const sizeValues = [18, 36, 58, 82];

const shapeNames = {
  circle: "丸",
  triangle: "三角",
  square: "四角",
  star: "星"
};

function shuffle(array) {
  const a = [...array];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function createShape(type, color, size) {
  const cx = 50;
  const cy = 50;

  if (type === "circle") {
    const r = size / 2;
    return `<svg class="shape" viewBox="0 0 100 100" aria-label="丸">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/>
    </svg>`;
  }

  if (type === "triangle") {
    const half = size / 2;
    const top = cy - half * 0.9;
    const bottom = cy + half * 0.9;
    const left = cx - half;
    const right = cx + half;
    return `<svg class="shape" viewBox="0 0 100 100" aria-label="三角">
      <polygon points="${cx},${top} ${right},${bottom} ${left},${bottom}" fill="${color}"/>
    </svg>`;
  }

  if (type === "square") {
    const half = size / 2;
    return `<svg class="shape" viewBox="0 0 100 100" aria-label="四角">
      <rect x="${cx-half}" y="${cy-half}" width="${size}" height="${size}" rx="2" fill="${color}"/>
    </svg>`;
  }

  const outer = size / 2;
  const inner = outer * 0.42;
  const points = [];
  for (let i = 0; i < 10; i++) {
    const angle = -Math.PI / 2 + i * Math.PI / 5;
    const radius = i % 2 === 0 ? outer : inner;
    points.push(`${cx + Math.cos(angle) * radius},${cy + Math.sin(angle) * radius}`);
  }

  return `<svg class="shape" viewBox="0 0 100 100" aria-label="星">
    <polygon points="${points.join(" ")}" fill="${color}"/>
  </svg>`;
}

function makeItem(id, type, color, size) {
  return {
    id,
    type,
    color,
    size,
    name: shapeNames[type],
    svg: createShape(type, color, size)
  };
}
/* 4〜7セット目：見本と選択肢で同じ表示サイズを使う */
function getSizeDisplayPx(size) {
  const map = {
    18: 42,
    36: 58,
    58: 74,
    82: 94
  };
  return map[size] ?? 74;
}


/* 1〜3セット：4種類。色はセットごとにランダム */
function createShapeSet(setNumber) {
  const colors = shuffle(colorPalette);

  const targets = [
    makeItem(`s${setNumber}-circle`, "circle", colors[0], 58),
    makeItem(`s${setNumber}-triangle`, "triangle", colors[1], 58),
    makeItem(`s${setNumber}-square`, "square", colors[2], 58),
    makeItem(`s${setNumber}-star`, "star", colors[3], 58)
  ];

  return {
    targets: shuffle(targets),
    choices: shuffle(targets)
  };
}

/* 4〜7セット：同じ形・同じ色で、大きさだけが異なる */
function createSizeSet(setNumber, type) {
  const color = colorPalette[Math.floor(Math.random() * colorPalette.length)];

  const targets = sizeValues.map((size, index) =>
    makeItem(`s${setNumber}-${type}-${index}`, type, color, size)
  );

  return {
    targets: shuffle(targets),
    choices: shuffle(targets)
  };
}

/* 8〜9セット：形は違うが、色が同じものが正解 */
function createColorSet(setNumber) {
  const fixedChoices = [
    makeItem(`s${setNumber}-choice-circle`, "circle", "#8f73b8", 58),
    makeItem(`s${setNumber}-choice-triangle`, "triangle", "#e8a84b", 58),
    makeItem(`s${setNumber}-choice-square`, "square", "#e96b63", 58),
    makeItem(`s${setNumber}-choice-star`, "star", "#62a6d8", 58)
  ];

  if (setNumber === 8) {
    const targetColors = ["#62a6d8", "#e96b63", "#e8a84b", "#8f73b8"];

    const targets = [
      makeItem(`s${setNumber}-target-blue`, "circle", "#62a6d8", 58),
      makeItem(`s${setNumber}-target-red`, "circle", "#e96b63", 58),
      makeItem(`s${setNumber}-target-yellow`, "circle", "#e8a84b", 58),
      makeItem(`s${setNumber}-target-purple`, "circle", "#8f73b8", 58)
    ].map((item, index) => ({
      ...item,
      frameColor: targetColors[index],
      svg: `<div class="color-target"></div>`
    }));

    return {
      targets: shuffle(targets),
      choices: shuffle(fixedChoices)
    };
  }

  /* 9セット目：
     見本と選択肢は「形」も「色」も同じ組み合わせにならない。
     正答条件は色が同じ。 */
  const targetShapes = shuffle(["circle", "triangle", "square", "star"]);
  const targetColors = shuffle([
    "#e96b63",
    "#62a6d8",
    "#e8a84b",
    "#8f73b8"
  ]);

  const targets = targetShapes.map((type, index) =>
    makeItem(
      `s${setNumber}-target-${index}`,
      type,
      targetColors[index],
      58
    )
  );

  /* 色は見本と同じだが、形を1つずらす。
     これにより、どの選択肢も見本と「形＋色」の両方が一致しない。 */
  const choices = targets.map((target, index) =>
    makeItem(
      `s${setNumber}-choice-${index}`,
      targetShapes[(index + 1) % targetShapes.length],
      target.color,
      58
    )
  );

  return {
    targets: shuffle(targets),
    choices: shuffle(choices)
  };
}

function getCurrentItems() {
  if (currentSet >= 9) return createEverydaySet(currentSet + 1);
  if (currentSet <= 2) {
    return createShapeSet(currentSet + 1);
  }

  if (currentSet === 3) return createSizeSet(4, "circle");
  if (currentSet === 4) return createSizeSet(5, "triangle");
  if (currentSet === 5) return createSizeSet(6, "square");
  if (currentSet === 6) return createSizeSet(7, "star");

  return createColorSet(currentSet + 1);
}

const TOTAL_SETS = 11;
let currentSet = 0;
let completedSets = 0;
let currentItems = null;

const board = document.getElementById("board");
const choices = document.getElementById("choices");
const message = document.getElementById("message");
const resetButton = document.getElementById("reset");
const dragGhost = document.getElementById("dragGhost");
const progress = document.getElementById("progress");

let selectedChoice = null;
let placed = new Set();
let dragId = null;

function updateProgress() {
  if (completedSets >= TOTAL_SETS) {
    progress.textContent = "よくできました";
  } else {
    progress.textContent =
      "●".repeat(completedSets) + "○".repeat(TOTAL_SETS - completedSets);
  }
}

function render() {
  document.querySelector(".app").classList.toggle("everyday-mode", currentSet >= 9);
  updateProgress();

  /* 課題中は「もういちど」を必ず非表示 */
  resetButton.style.display = "none";
  resetButton.style.visibility = "hidden";

  currentItems = getCurrentItems();
  board.innerHTML = "";
  choices.innerHTML = "";
  selectedChoice = null;
  placed = new Set();
  dragId = null;
  dragGhost.style.display = "none";
  dragGhost.innerHTML = "";
  message.textContent = "";

  if (currentSet >= 9) { renderEveryday(); return; }

  shuffle(currentItems.targets).forEach(item => {
    const card = document.createElement("section");
    card.className = "target-card";
    card.dataset.target = item.id;

    const model = document.createElement("div");
    model.className = "model-area";
    if (currentSet === 7 && item.frameColor) {
      model.innerHTML = `<div class="model-shape color-target" style="background:${item.frameColor};"></div>`;
    } else if (currentSet >= 3 && currentSet <= 6) {
      const px = getSizeDisplayPx(item.size);
      model.innerHTML = `<div class="model-shape size-matched" style="width:${px}px;height:${px}px;">${item.svg}</div>`;
    } else {
      model.innerHTML = `<div class="model-shape">${item.svg}</div>`;
    }

    const drop = document.createElement("div");
    drop.className = "drop-area";
    drop.dataset.target = item.id;

    drop.style.background = "#ffffff";

    card.appendChild(model);
    card.appendChild(drop);
    board.appendChild(card);

    drop.addEventListener("pointerenter", () => {
      if (dragId) {
        drop.classList.add("highlight");
      }
    });

    drop.addEventListener("pointerleave", () => {
      drop.classList.remove("highlight");
      drop.style.background = "#ffffff";
    });
  });

  shuffle(currentItems.choices).forEach(item => {
    const choice = document.createElement("div");
    choice.className = "choice";
    choice.dataset.id = item.id;

    if (currentSet >= 3 && currentSet <= 6) {
      const px = getSizeDisplayPx(item.size);
      choice.innerHTML = `<div class="choice-size-matched" style="width:${px}px;height:${px}px;">${item.svg}</div>`;
    } else {
      choice.innerHTML = item.svg;
    }

    choice.setAttribute("aria-label", item.name);
    choice.setAttribute("role", "button");

    choice.addEventListener("pointerdown", e => {
      if (placed.has(item.id)) return;

      dragId = item.id;
      selectedChoice = null;

      if (currentSet >= 3 && currentSet <= 6) {
        const px = getSizeDisplayPx(item.size);
        dragGhost.innerHTML = `<div style="width:${px}px;height:${px}px;display:flex;align-items:center;justify-content:center;">${item.svg}</div>`;
      } else {
        dragGhost.innerHTML = item.svg;
      }
      dragGhost.style.display = "flex";
      moveDragGhost(e.clientX, e.clientY);

      choice.setPointerCapture?.(e.pointerId);
    });

    choices.appendChild(choice);
  });

  updateSelection();
}

function updateSelection() {
  document.querySelectorAll(".choice").forEach(el => {
    el.style.outline = (el.dataset.id === selectedChoice && !placed.has(el.dataset.id))
      ? "5px solid #f0c33c"
      : "";
    el.style.outlineOffset = "-5px";
  });
}

function isCorrect(choice, target) {
  if (currentSet >= 7) {
    /* 8・9セット目：色が同じなら正解 */
    return choice.color === target.color;
  }

  if (currentSet >= 3) {
    /* 4〜7セット目：形と大きさが同じなら正解 */
    return choice.type === target.type && choice.size === target.size;
  }

  /* 1〜3セット目：形と色が同じなら正解 */
  return choice.type === target.type && choice.color === target.color;
}

function placeShape(choiceId, targetId) {
  if (currentSet >= 9) { placeEveryday(choiceId, targetId); return; }
  if (!choiceId || !targetId || placed.has(choiceId)) return;

  const target = currentItems.targets.find(item => item.id === targetId);
  const choice = currentItems.choices.find(item => item.id === choiceId);
  if (!target || !choice) return;

  if (isCorrect(choice, target)) {
    const drop = document.querySelector(`.drop-area[data-target="${targetId}"]`);
    if (currentSet >= 3 && currentSet <= 6) {
      const px = getSizeDisplayPx(choice.size);
      drop.innerHTML = `<div class="placed-shape" style="width:${px}px;height:${px}px;">${choice.svg}</div>`;
    } else {
      drop.innerHTML = `<div class="placed-shape">${choice.svg}</div>`;
    }
    drop.classList.remove("highlight");

    drop.classList.add("correct");

    drop.style.background = "#ffffff";

    const choiceElement = document.querySelector(`.choice[data-id="${choiceId}"]`);
    if (choiceElement) choiceElement.classList.add("used");

    placed.add(choiceId);
    selectedChoice = null;
    message.textContent = "";
    updateSelection();

    if (placed.size === currentItems.targets.length) {
      setTimeout(() => {
        completedSets++;

        if (completedSets >= TOTAL_SETS) {
          updateProgress();
          document.body.classList.add("finished");
          resetButton.style.display = "block";
          resetButton.style.visibility = "visible";
          message.textContent = "";
        } else {
          currentSet++;
          updateProgress();
          render();
        }
      }, 900);
    }
  } else {
    message.textContent = "もう一度";
    selectedChoice = choiceId;
    updateSelection();
  }
}

resetButton.addEventListener("click", () => {
  /* 11セット終了後だけ使用可能 */
  if (completedSets >= TOTAL_SETS) {
    resetButton.style.display = "none";
    resetButton.style.visibility = "hidden";
    document.body.classList.remove("finished");
    completedSets = 0;
    currentSet = 0;
    render();
  }
});

function moveDragGhost(x, y) {
  dragGhost.style.left = `${x}px`;
  dragGhost.style.top = `${y}px`;
}

document.addEventListener("pointermove", e => {
  if (!dragId) return;

  moveDragGhost(e.clientX, e.clientY);

  const el = document.elementFromPoint(e.clientX, e.clientY);
  const drop = el?.closest?.(".drop-area");
  document.querySelectorAll(".drop-area").forEach(d => {
    d.classList.remove("highlight");
    d.style.background = "#ffffff";
  });

  if (drop) {
    drop.classList.add("highlight");
  }
});

document.addEventListener("pointerup", e => {
  if (!dragId) return;

  const choiceId = dragId;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const drop = el?.closest?.(".drop-area");

  if (drop) {
    placeShape(choiceId, drop.dataset.target);
  }

  document.querySelectorAll(".drop-area").forEach(d => {
    d.classList.remove("highlight");
    d.style.background = "#ffffff";
  });
  dragId = null;
  dragGhost.style.display = "none";
  dragGhost.innerHTML = "";
});

// Everyday objects are drawn as transparent SVGs with clear front-facing outlines.
function objectSvg(name, drawing) {
  return `<svg class="shape object-art" viewBox="0 0 120 120" role="img" aria-label="${name}" xmlns="http://www.w3.org/2000/svg"><g stroke="#594b40" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">${drawing}</g></svg>`;
}
const everydayObjects = [
  ["onigiri", "おにぎり", "triangle", '<path d="M60 12 Q64 12 68 20 L108 96 Q112 105 101 107 H19 Q8 105 12 96 L52 20 Q56 12 60 12Z" fill="#fff9e9"/><path d="M44 77 H76 V107 H44Z" fill="#344737"/><g fill="#cfc4ab" stroke="none"><circle cx="38" cy="66" r="2"/><circle cx="75" cy="55" r="2"/><circle cx="58" cy="36" r="2"/></g>'],
  ["sandwich", "サンドイッチ", "triangle", '<path d="M15 104 L60 14 L105 104Z" fill="#bd793f"/><path d="M22 98 L60 23 L98 98Z" fill="#fff5d9"/><path d="M28 88 L60 33 L92 88Z" fill="#f5d669"/><path d="M32 82 L60 42 L87 82" fill="none" stroke="#70a454" stroke-width="6"/><path d="M39 70 L60 48 L79 70" fill="none" stroke="#de7a79" stroke-width="5"/>'],
  ["pizza", "ピザ", "triangle", '<path d="M60 13 L108 103 H12Z" fill="#edbd58"/><path d="M60 25 L99 96 H21Z" fill="#f8dc75"/><path d="M15 102 H105" stroke="#bb7a3d" stroke-width="12"/><g fill="#d55b4c"><circle cx="60" cy="46" r="8"/><circle cx="45" cy="78" r="8"/><circle cx="77" cy="81" r="8"/></g>'],
  ["watermelon", "すいか", "triangle", '<path d="M60 13 L108 103 H12Z" fill="#6b9b53"/><path d="M60 22 L99 96 H21Z" fill="#f5edb6"/><path d="M60 29 L93 89 H27Z" fill="#eb726d"/><g fill="#403d35" stroke="none"><ellipse cx="60" cy="51" rx="2.5" ry="4"/><ellipse cx="48" cy="74" rx="2.5" ry="4"/><ellipse cx="72" cy="77" rx="2.5" ry="4"/></g>'],
  ["bread", "食パン", "square", '<rect x="15" y="15" width="90" height="90" rx="5" fill="#c98c50"/><rect x="23" y="23" width="74" height="74" rx="3" fill="#fff1d2"/><g fill="#e4cca3" stroke="none"><circle cx="40" cy="39" r="2"/><circle cx="79" cy="53" r="2"/><circle cx="57" cy="80" r="2"/></g>'],
  ["cookie", "クッキー", "square", '<rect x="16" y="16" width="88" height="88" rx="4" fill="#d5a367"/><rect x="23" y="23" width="74" height="74" rx="2" fill="#e8bf82" stroke="#b98751" stroke-dasharray="2 7"/><g fill="#6f4933" stroke="none"><circle cx="39" cy="39" r="5"/><circle cx="77" cy="42" r="5"/><circle cx="58" cy="62" r="5"/><circle cx="38" cy="82" r="5"/><circle cx="81" cy="80" r="5"/></g>'],
  ["window", "窓", "square", '<rect x="14" y="14" width="92" height="92" fill="#cfac80"/><rect x="22" y="22" width="76" height="76" fill="#b9dfed"/><path d="M60 22 V98 M22 60 H98" stroke="#cfac80" stroke-width="7"/><path d="M30 43 L43 30 M72 89 L89 72" stroke="#f5fcff" stroke-width="4"/>'],
  ["door", "ドア", "square", '<rect x="28" y="10" width="64" height="100" fill="#ab7954"/><rect x="34" y="16" width="52" height="94" fill="#d5aa7b"/><rect x="42" y="26" width="36" height="30" fill="#dfbc96"/><rect x="42" y="69" width="36" height="31" fill="#dfbc96"/><circle cx="77" cy="63" r="4" fill="#e8c65c"/>'],
  ["book", "本", "square", '<rect x="23" y="13" width="75" height="94" rx="2" fill="#789bc0"/><path d="M31 13 V107" fill="none"/><rect x="43" y="31" width="42" height="25" rx="2" fill="#fff4d7"/><path d="M49 41 H79 M49 48 H72" stroke="#789bc0" stroke-width="2"/><path d="M35 99 H92" stroke="#f5ead6" stroke-width="4"/>'],
  ["tire", "タイヤ", "circle", '<circle cx="60" cy="60" r="47" fill="#444b50"/><circle cx="60" cy="60" r="34" fill="#30373c"/><circle cx="60" cy="60" r="25" fill="#c4c9cb"/><path d="M60 37 V83 M37 60 H83 M44 44 L76 76 M44 76 L76 44" stroke="#7c858a" stroke-width="5"/><circle cx="60" cy="60" r="7" fill="#a4adb2"/>'],
  ["plate", "皿", "circle", '<circle cx="60" cy="60" r="47" fill="#f6fbff" stroke="#6e9eb5"/><circle cx="60" cy="60" r="38" fill="none" stroke="#bad9e7" stroke-width="5"/><circle cx="60" cy="60" r="29" fill="#e9f5fb" stroke="#a7c9d9" stroke-width="2"/>'],
  ["clock", "時計", "circle", '<circle cx="60" cy="60" r="47" fill="#ccaa78"/><circle cx="60" cy="60" r="40" fill="#fffdf4"/><g stroke="#665b4d" stroke-width="2"><path d="M60 24 V29 M96 60 H91 M60 96 V91 M24 60 H29"/></g><g fill="#594b40" stroke="none" font-family="sans-serif" font-size="12" text-anchor="middle"><text x="60" y="41">12</text><text x="83" y="64">3</text><text x="60" y="87">6</text><text x="37" y="64">9</text></g><path d="M60 60 V46 M60 60 L76 70" stroke-width="4"/><circle cx="60" cy="60" r="3" fill="#594b40"/>'],
  ["coin", "100円玉", "circle", '<circle cx="60" cy="60" r="47" fill="#c9cdcf" stroke="#7c8286"/><circle cx="60" cy="60" r="41" fill="none" stroke="#969da1" stroke-width="2"/><g fill="#61696f" stroke="none" font-family="sans-serif" text-anchor="middle"><text x="60" y="41" font-size="12">日本国</text><text x="60" y="76" font-size="35" font-weight="bold">100</text><text x="60" y="94" font-size="11">円</text></g>'],
  ["button", "ボタン", "circle", '<circle cx="60" cy="60" r="47" fill="#d88d86"/><circle cx="60" cy="60" r="36" fill="#eaaea5"/><g fill="#fff" stroke="#9d655f" stroke-width="2"><circle cx="49" cy="49" r="5"/><circle cx="71" cy="49" r="5"/><circle cx="49" cy="71" r="5"/><circle cx="71" cy="71" r="5"/></g>']
].map(([key, name, category, drawing]) => ({ key, name, category, svg: objectSvg(name, drawing) }));

function createEverydaySet(setNumber) {
  const categories = ["triangle", "square", "circle"];
  const extra = categories[Math.floor(Math.random() * categories.length)];
  const selected = categories.flatMap(category => shuffle(everydayObjects.filter(item => item.category === category)).slice(0, category === extra ? 4 : 3));
  return {
    targets: categories.map(category => ({ id: `s${setNumber}-${category}`, category })),
    choices: shuffle(selected).map(item => ({ ...item, id: `s${setNumber}-${item.key}` }))
  };
}
let everydayTransition = false;
function renderEveryday() {
  everydayTransition = false;
  const labels = { triangle: "△ 三角", square: "□ ▭ 四角", circle: "○ 丸" };
  currentItems.targets.forEach(item => {
    const card = document.createElement("section");
    card.className = "target-card category-card";
    card.innerHTML = `<h2>${labels[item.category]}</h2><div class="drop-area category-drop" data-target="${item.id}" aria-label="${labels[item.category]}に入れる"></div>`;
    board.appendChild(card);
  });
  currentItems.choices.forEach(item => {
    const choice = document.createElement("div");
    choice.className = "choice object-choice";
    choice.dataset.id = item.id;
    choice.innerHTML = item.svg;
    choice.setAttribute("aria-label", item.name);
    choice.addEventListener("pointerdown", e => {
      if (placed.has(item.id) || everydayTransition || dragId) return;
      e.preventDefault();
      dragId = item.id;
      dragGhost.innerHTML = item.svg;
      dragGhost.style.display = "flex";
      moveDragGhost(e.clientX, e.clientY);
      choice.setPointerCapture?.(e.pointerId);
    });
    choices.appendChild(choice);
  });
}
function placeEveryday(choiceId, targetId) {
  if (everydayTransition || placed.has(choiceId)) return;
  const choice = currentItems.choices.find(item => item.id === choiceId);
  const target = currentItems.targets.find(item => item.id === targetId);
  if (!choice || !target) return;
  if (choice.category !== target.category) {
    message.textContent = "もう一度";
    return;
  }
  const drop = document.querySelector(`.category-drop[data-target="${targetId}"]`);
  const illustration = document.createElement("div");
  illustration.className = "sorted-object";
  illustration.innerHTML = choice.svg;
  drop.appendChild(illustration);
  document.querySelector(`.choice[data-id="${choiceId}"]`).classList.add("sorted");
  placed.add(choiceId);
  message.textContent = "";
  if (placed.size === currentItems.choices.length) {
    everydayTransition = true;
    setTimeout(() => {
      completedSets++;
      updateProgress();
      if (completedSets === TOTAL_SETS) {
        document.body.classList.add("finished");
        resetButton.style.visibility = "visible";
        resetButton.style.display = "block";
      } else {
        currentSet++;
        render();
      }
    }, 900);
  }
}
document.addEventListener("pointercancel", () => {
  dragId = null;
  dragGhost.style.display = "none";
  dragGhost.innerHTML = "";
  document.querySelectorAll(".drop-area").forEach(el => el.classList.remove("highlight"));
});

render();
</script>
